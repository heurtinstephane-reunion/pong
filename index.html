<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0b0e14;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
  }
  #wrap { text-align: center; }
  canvas {
    background: #10141f;
    border: 2px solid #2a3350;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(60, 120, 255, 0.15);
    max-width: 95vw;
    max-height: 85vh;
    touch-action: none;
  }
  #help {
    color: #5b6b94;
    margin-top: 10px;
    font-size: 13px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="help">Souris ou ↑/↓ (W/S) — Tactile : glisse n'importe où — Espace : lancer / pause</div>
</div>
<script>
(() => {
  const W = 800, H = 480;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const PADDLE_W = 12, PADDLE_H = 90, PADDLE_MARGIN = 24;
  const BALL_SIZE = 12;
  const WIN_SCORE = 7;
  const BASE_SPEED = 5.5, MAX_SPEED = 13;

  let state = 'menu';
  let playerScore = 0, aiScore = 0;
  let rally = 0;

  const player = { x: PADDLE_MARGIN, y: H / 2 - PADDLE_H / 2, vy: 0 };
  const ai = { x: W - PADDLE_MARGIN - PADDLE_W, y: H / 2 - PADDLE_H / 2, vy: 0 };
  const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, prevX: W / 2 };

  const keys = {};
  let mouseY = null;

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.prevX = W / 2;
    ball.vx = direction * BASE_SPEED;
    ball.vy = (Math.random() * 2 - 1) * 3;
    rally = 0;
  }

  function startGame() {
    playerScore = 0;
    aiScore = 0;
    resetBall(Math.random() < 0.5 ? 1 : -1);
    state = 'playing';
  }

  document.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === ' ') {
      if (state === 'menu' || state === 'over') startGame();
      else if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
  });
  document.addEventListener('keyup', (e) => { keys[e.key] = false; });

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseY = (e.clientY - rect.top) * (H / rect.height);
  });
  canvas.addEventListener('mouseleave', () => { mouseY = null; });

  canvas.addEventListener('click', () => {
    if (state === 'menu' || state === 'over') startGame();
  });
  function touchY(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.touches[0].clientY - rect.top) * (H / rect.height);
  }
  window.addEventListener('touchstart', (e) => {
    if (state === 'menu' || state === 'over') { startGame(); return; }
    e.preventDefault();
    mouseY = touchY(e);
  }, { passive: false });
  window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    mouseY = touchY(e);
  }, { passive: false });

  function collidePaddle(p, movingLeft) {
    if (ball.y + BALL_SIZE < p.y || ball.y - BALL_SIZE > p.y + PADDLE_H) return;
    if (movingLeft) {
      const plane = p.x + PADDLE_W + BALL_SIZE / 2;
      if (ball.x <= plane && ball.prevX > plane) {
        ball.x = plane;
        hitPaddle(p, 1);
      }
    } else {
      const plane = p.x - BALL_SIZE / 2;
      if (ball.x >= plane && ball.prevX < plane) {
        ball.x = plane;
        hitPaddle(p, -1);
      }
    }
  }

  function hitPaddle(p, dir) {
    const rel = ((ball.y - (p.y + PADDLE_H / 2)) / (PADDLE_H / 2));
    const clamped = Math.max(-1, Math.min(1, rel));
    const speed = Math.min(MAX_SPEED, Math.hypot(ball.vx, ball.vy) + 0.4);
    const maxAngle = Math.PI / 3;
    const angle = clamped * maxAngle;
    ball.vx = Math.cos(angle) * speed * dir;
    ball.vy = Math.sin(angle) * speed;
    rally++;
  }

  function update() {
    if (state !== 'playing') return;

    // Joueur
    if (mouseY !== null) {
      const target = mouseY - PADDLE_H / 2;
      player.y += (target - player.y) * 0.35;
    }
    if (keys['ArrowUp'] || keys['w']) player.y -= 8;
    if (keys['ArrowDown'] || keys['s']) player.y += 8;
    player.y = Math.max(0, Math.min(H - PADDLE_H, player.y));

    // IA : suit la balle avec une vitesse limitée
    const aiSpeed = 4.6;
    const aiCenter = ai.y + PADDLE_H / 2;
    if (ball.vx > 0) {
      if (ball.y > aiCenter + 10) ai.y += aiSpeed;
      else if (ball.y < aiCenter - 10) ai.y -= aiSpeed;
    } else {
      const midY = H / 2;
      if (midY > aiCenter + 10) ai.y += aiSpeed * 0.25;
      else if (midY < aiCenter - 10) ai.y -= aiSpeed * 0.25;
    }
    ai.y = Math.max(0, Math.min(H - PADDLE_H, ai.y));

    // Balle : sous-pas pour eviter le tunnelling a haute vitesse
    const steps = Math.min(12, Math.max(2, Math.ceil(Math.max(Math.abs(ball.vx), Math.abs(ball.vy)) / 5)));
    const dt = 1 / steps;
    for (let i = 0; i < steps; i++) {
      ball.prevX = ball.x;
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.y - BALL_SIZE / 2 < 0) {
        ball.y = BALL_SIZE / 2;
        ball.vy = -ball.vy;
      }
      if (ball.y + BALL_SIZE / 2 > H) {
        ball.y = H - BALL_SIZE / 2;
        ball.vy = -ball.vy;
      }

      collidePaddle(player, true);
      collidePaddle(ai, false);

      if (ball.x < -BALL_SIZE) {
        aiScore++;
        checkWin();
        if (state === 'playing') resetBall(1);
        break;
      } else if (ball.x > W + BALL_SIZE) {
        playerScore++;
        checkWin();
        if (state === 'playing') resetBall(-1);
        break;
      }
    }
  }

  function checkWin() {
    if (playerScore >= WIN_SCORE) state = 'over';
    if (aiScore >= WIN_SCORE) state = 'over';
  }

  function drawNet() {
    ctx.strokeStyle = 'rgba(120, 140, 200, 0.25)';
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 14]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawScore() {
    ctx.fillStyle = 'rgba(140, 160, 220, 0.5)';
    ctx.font = 'bold 56px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(playerScore, W / 2 - 70, 70);
    ctx.fillText(aiScore, W / 2 + 70, 70);
  }

  function drawText(text, sub) {
    ctx.fillStyle = '#c8d4f5';
    ctx.font = 'bold 42px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(text, W / 2, H / 2 - 20);
    if (sub) {
      ctx.font = '18px "Courier New", monospace';
      ctx.fillStyle = '#5b6b94';
      ctx.fillText(sub, W / 2, H / 2 + 25);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawNet();
    drawScore();

    ctx.fillStyle = '#7ee081';
    ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#f28b82';
    ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);
    ctx.fillStyle = '#e8ecf8';
    ctx.fillRect(ball.x - BALL_SIZE / 2, ball.y - BALL_SIZE / 2, BALL_SIZE, BALL_SIZE);

    if (state === 'menu') drawText('PONG', 'Clique ou appuie sur Espace pour jouer');
    if (state === 'paused') drawText('PAUSE', 'Espace pour reprendre');
    if (state === 'over') {
      drawText(
        playerScore > aiScore ? 'GAGNÉ !' : 'PERDU…',
        'Clique ou Espace pour rejouer'
      );
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
